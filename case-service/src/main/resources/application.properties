spring.application.name=case-service
server.port=8081
# reachable from this machine only; containers set SERVER_ADDRESS=0.0.0.0 (see ops/docker-compose.yml)
server.address=127.0.0.1
# writes from any other machine need this key in the X-BT-Key header (empty: this machine only)
bt.api-key=${BT_API_KEY:}

# durable human decisions (steps, approvals, audit); cases themselves are recomputed each run
spring.datasource.url=jdbc:h2:file:./data/casedb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# runs up to ~2,000 cases with drafts in one post
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true

# in-house model service for drafts; empty => deterministic templates (the fallback)
bt.model-url=
bt.model-timeout-seconds=8

# a second person checks "worth a look" clears: always when a cleared clue names this many dollars or more (set from
# the dev books, see WHY.md), otherwise this share of clears, drawn at random after the clear
bt.second-check.large-amount=500000
bt.second-check.rate=0.10

# the bank running it: signs the letters. Wells Fargo is the worked example; the Python checks read BT_BANK_NAME
bt.bank-name=${BT_BANK_NAME:Wells Fargo}

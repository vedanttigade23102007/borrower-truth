[project]
name = "borrower-truth"
version = "0.1.0"
description = "Seven connected checks that answer: is this borrower's picture of itself true? All demo data is synthetic."
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "duckdb>=1.1",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pyarrow>=17",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
stream = ["confluent-kafka>=2.5"]
docs = ["pillow>=10.3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

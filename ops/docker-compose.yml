# Full stack for the demo. Runs in GitHub Codespaces (4-core / 16 GB), not on the 8 GB Mac.
#   export BT_API_KEY=$(openssl rand -hex 16)                           # shared key for writes to the case service
#   docker compose -f ops/docker-compose.yml up -d                      # core stack
#   docker compose -f ops/docker-compose.yml --profile batch up -d      # + Airflow
# Ports (bound to localhost only): case service 8081 · Grafana 3001 · Prometheus 9090 · Pushgateway 9091 · Kafka 9092 · Airflow 8080
name: borrower-truth

services:
  redpanda:            # Kafka-API compatible broker, single node
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command: [redpanda, start, --mode, dev-container, --smp, "1", --memory, 1G,
              --kafka-addr, "internal://0.0.0.0:9093,external://0.0.0.0:9092",
              --advertise-kafka-addr, "internal://redpanda:9093,external://localhost:9092"]
    ports: ["127.0.0.1:9092:9092"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      retries: 10

  topics:              # create topics with partitions keyed by borrower
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on: {redpanda: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "-c"]
    command: ["rpk -X brokers=redpanda:9093 topic create payments -p 6 || true;
               rpk -X brokers=redpanda:9093 topic create signals -p 6 || true;
               rpk -X brokers=redpanda:9093 topic create payments.dlq -p 1 || true"]

  case-service:
    build: ../case-service
    ports: ["127.0.0.1:8081:8081"]
    environment:
      SERVER_ADDRESS: 0.0.0.0     # inside the container network; the host port above stays localhost-only
      BT_API_KEY: ${BT_API_KEY:-}   # set it before "up" (see the top); without it, writes from other containers get 403
    volumes: ["casedb:/app/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      retries: 12

  s3-worker:
    build: {context: .., dockerfile: ops/worker.Dockerfile}
    command: ["python", "-m", "bt.stream.s3_worker", "--data", "data/out/demo", "--bootstrap", "redpanda:9093"]
    environment: {PUSHGATEWAY_URL: "http://pushgateway:9091"}
    volumes: ["../data:/app/data"]
    depends_on: {topics: {condition: service_completed_successfully}}
    restart: unless-stopped

  signal-bridge:       # real-time S3 alerts -> case service (live alerts on the case page)
    build: {context: .., dockerfile: ops/worker.Dockerfile}
    command: ["python", "-m", "bt.stream.signal_bridge", "--bootstrap", "redpanda:9093", "--api", "http://case-service:8081"]
    environment: {PUSHGATEWAY_URL: "http://pushgateway:9091", BT_API_KEY: "${BT_API_KEY:-}"}
    volumes: ["../data:/app/data"]
    depends_on:
      topics: {condition: service_completed_successfully}
      case-service: {condition: service_healthy}
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports: ["127.0.0.1:9091:9091"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/borrower-truth.json
      GF_RENDERING_SERVER_URL: http://renderer:8081/render      # used only when the "render" profile runs
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3001:3000"]

  renderer:            # turns a dashboard into a PNG, so its panels can be checked without a browser
    profiles: ["render"]
    image: grafana/grafana-image-renderer:3.11.6

  airflow:
    profiles: ["batch"]
    build: {context: ., dockerfile: airflow.Dockerfile}
    command: standalone
    user: "1000:0"     # same uid as the workspace owner, so the nightly job can write its outputs
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_VAR_BT_REPO: /workspaces/borrower-truth
      AIRFLOW_VAR_BT_DATA: data/out/demo
      CASE_SERVICE_URL: http://case-service:8081
      BT_API_KEY: ${BT_API_KEY:-}
      PUSHGATEWAY_URL: http://pushgateway:9091
      UV_PROJECT_ENVIRONMENT: /tmp/bt-venv
      UV_CACHE_DIR: /tmp/uv-cache
    volumes: ["../airflow/dags:/opt/airflow/dags:ro", "..:/workspaces/borrower-truth"]
    ports: ["127.0.0.1:8080:8080"]

volumes:
  casedb:
